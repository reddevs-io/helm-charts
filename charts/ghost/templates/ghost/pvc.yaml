{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    # Never let a `helm uninstall` (or an ArgoCD prune) delete a data volume the
    # chart provisioned — the claim outlives the release. Detach it explicitly
    # if you really intend to reclaim the storage.
    "helm.sh/resource-policy": keep
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
  name: {{ include "ghost.fullname" . }}-content
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
{{- end }}
