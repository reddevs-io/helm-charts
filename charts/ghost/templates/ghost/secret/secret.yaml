{{- if and .Values.env.secret (not .Values.env.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
  name: {{ include "ghost.fullname" . }}
stringData:
  {{- range $key, $val := .Values.env.secret }}
  {{ $key }}: {{ $val | quote }}
  {{- end}}
type: Opaque
{{- end -}}
