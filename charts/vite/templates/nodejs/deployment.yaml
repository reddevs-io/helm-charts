{{- if .Values.nodejs.enable }}
{{- $nodejsFullname := printf "%s-nodejs" (include "vite.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    {{- if ne .Values.nodejs.strategy.type "RollingUpdate" }}
    ignore-check.kube-linter.io/no-rolling-update-strategy: "Recreate is required for ReadWriteOnce PVCs: a RollingUpdate surge pod deadlocks on volume attach"
    {{- end }}
    reloader.stakater.com/auto: "true"
  labels:
    {{- include "vite.nodejs.labels" . | nindent 4 }}
  name: {{ $nodejsFullname }}
spec:
  {{- if not .Values.nodejs.autoscaling.enabled }}
  replicas: {{ .Values.nodejs.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vite.nodejs.selectorLabels" . | nindent 6 }}
  strategy:
    {{- if eq .Values.nodejs.strategy.type "RollingUpdate" }}
    # rollingUpdate parameters are only valid (and only rendered) for the
    # RollingUpdate type — the API server rejects them alongside Recreate.
    rollingUpdate:
      {{- toYaml .Values.nodejs.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
    type: {{ .Values.nodejs.strategy.type }}
  template:
    metadata:
      {{- with .Values.nodejs.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "vite.nodejs.labels" . | nindent 8 }}
        {{- with .Values.nodejs.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.nodejs.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        -
          {{- if or .Values.nodejs.env.normal (and .Values.nodejs.env.secret (not .Values.nodejs.env.existingSecret)) }}
          env:
          {{- if not .Values.nodejs.env.existingSecret }}
          {{- range $key, $val := .Values.nodejs.env.secret }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  key: {{ $key }}
                  name: {{ $nodejsFullname }}
          {{- end}}
          {{- end }}
          {{- range $key, $val := .Values.nodejs.env.normal }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  key: {{ $key }}
                  name: {{ $nodejsFullname }}
          {{- end}}
          {{- end}}
          {{- if .Values.nodejs.env.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.nodejs.env.existingSecret }}
          {{- end }}
          image: "{{ .Values.nodejs.image.repository }}:{{ .Values.nodejs.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.nodejs.image.pullPolicy }}
          {{- with .Values.nodejs.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          name: nodejs
          ports:
            - containerPort: {{ .Values.nodejs.service.port }}
              name: http
              protocol: TCP
          {{- with .Values.nodejs.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodejs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodejs.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodejs.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      {{- with .Values.nodejs.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodejs.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      {{- with .Values.nodejs.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vite.nodejs.serviceAccountName" . }}
      {{- with .Values.nodejs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodejs.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
