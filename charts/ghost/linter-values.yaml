image:
  repository: "ghost"
  tag: "5-alpine"

imagePullSecrets:
  - name: container-registry-cred

env:
  normal:
    TEST_VARIABLE_1: "test1"
    TEST_VARIABLE_2: "test2"
  secret:
    TEST_SECRET_VARIABLE_1: "testsecret1"
    TEST_SECRET_VARIABLE_2: "testsecret2"

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  awsProvider:
    enabled: true
    region: eu-central-1
    iam:
      accessKey: "my-access-key"
      secretAccessKey: "my-secret-access-key"
  data:
    - secretKey: database__connection__password
      envName: database__connection__password
      remoteRef:
        key: ghost-awssm-iam
        property: password
        version: "AWSCURRENT"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    ingress.kubernetes.io/force-ssl-redirect: 'true'
    kubernetes.io/tls-acme: 'true'
  hosts:
    - host: example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: example-com-tls
      hosts:
        - example.com

gatewayApi:
  enabled: true
  httpRoute:
    annotations: {}
    hostnames:
      - "example.com"
      - "www.example.com"
    parentRefs:
      - name: my-gateway
        namespace: gateway-system
        sectionName: "https"
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /api
        timeouts:
          request: 300s
      - matches:
          - path:
              type: Exact
              value: /old
        filters:
          - type: RequestRedirect
            requestRedirect:
              path:
                type: ReplaceFullPath
                replaceFullPath: /new
              statusCode: 301
      - filters:
          - type: RequestHeaderModifier
            requestHeaderModifier:
              set:
                - name: X-Forwarded-Proto
                  value: https

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

persistence:
  enabled: true

redis:
  enable: true

  env:
    normal:
      TEST_VARIABLE_1: "test1"
      TEST_VARIABLE_2: "test2"
    secret:
      TEST_SECRET_VARIABLE_1: "testsecret1"
      TEST_SECRET_VARIABLE_2: "testsecret2"
